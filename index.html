<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sugirvas Senthilkumar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #00ff00;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Courier New", Courier, monospace;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h2 {
            margin-top: 14px;
            margin-bottom: 28px;

            font-size: 20px;
            font-weight: normal;
            letter-spacing: 6px;
        }

        .contact {
            margin: 10px 0;
            font-size: 16px;
        }

        .contact a {
            color: #00ff00;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* =========================
           F-91W INSPIRED WATCH
        ========================= */

        .watch {
            position: fixed;
            top: 22px;
            right: 22px;

            width: 190px;

            background: #111111;

            border: 3px solid #333333;
            border-radius: 6px;

            padding: 9px 10px 10px;

            color: #dddddd;

            font-family: Arial, Helvetica, sans-serif;

            box-shadow:
                0 0 0 1px #000000,
                0 4px 12px rgba(0, 0, 0, 0.8);

            z-index: 1000;
        }

        .watch-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 4px;

            font-size: 9px;
            font-weight: bold;

            letter-spacing: 1px;
        }

        .watch-model {
            color: #00bfff;
        }

        .watch-water {
            color: #ff4040;
        }

        .watch-label {
            text-align: center;

            color: #dddddd;

            font-size: 8px;
            letter-spacing: 1px;

            margin-bottom: 4px;
        }

        .watch-screen {
            background: #b7bda5;

            border: 3px solid #444444;
            border-radius: 2px;

            padding: 6px 8px;

            color: #101410;

            box-shadow:
                inset 0 0 5px rgba(0, 0, 0, 0.35);
        }

        .watch-info {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-family: "Courier New", monospace;
            font-size: 11px;
            font-weight: bold;

            margin-bottom: 2px;
        }

        .watch-time {
            text-align: center;

            font-family: "Courier New", monospace;

            font-size: 28px;
            font-weight: bold;

            letter-spacing: -2px;

            line-height: 1;
        }

        .watch-seconds {
            font-size: 14px;
            margin-left: 2px;
        }

        .watch-bottom {
            display: flex;
            justify-content: space-between;

            margin-top: 5px;

            font-size: 7px;
            color: #aaaaaa;

            letter-spacing: 0.5px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            h1 {
                font-size: 32px;
                letter-spacing: 2px;
            }

            h2 {
                font-size: 16px;
                letter-spacing: 4px;
            }

            .contact {
                font-size: 14px;
            }

            .watch {
                width: 155px;

                top: 12px;
                right: 12px;

                padding: 7px;
            }

            .watch-time {
                font-size: 22px;
            }

            .watch-top {
                font-size: 7px;
            }

            .watch-label {
                font-size: 6px;
            }

            .watch-info {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <!-- F-91W INSPIRED WATCH -->

    <div class="watch">

        <div class="watch-top">
            <span class="watch-model">F-91W</span>
            <span class="watch-water">WATER RESIST</span>
        </div>

        <div class="watch-label">
            ALARM CHRONOGRAPH
        </div>

        <div class="watch-screen">

            <div class="watch-info">
                <span id="watch-day">TH</span>
                <span id="watch-date">9-17</span>
            </div>

            <div class="watch-time">
                <span id="watch-hour">18</span>:<span id="watch-minute">12</span><span class="watch-seconds" id="watch-second">00</span>
            </div>

        </div>

        <div class="watch-bottom">
            <span>LIGHT</span>
            <span>MODE</span>
            <span>ALARM</span>
        </div>

    </div>


    <!-- MAIN WEBSITE -->

    <main class="container">

        <h1>SUGIRVAS SENTHILKUMAR</h1>

        <h2>CYBERSECURITY</h2>

        <p class="contact">
            EMAIL:
            <a href="mailto:sugirvas01@gmail.com">
                sugirvas01@gmail.com
            </a>
        </p>

        <p class="contact">
            PHONE: +91 XXXXXXXXXX
        </p>

    </main>


    <!-- WATCH CLOCK SCRIPT -->

    <script>

        function updateWatch() {

            const now = new Date();

            const days = [
                "SU",
                "MO",
                "TU",
                "WE",
                "TH",
                "FR",
                "SA"
            ];

            const hours =
                String(now.getHours()).padStart(2, "0");

            const minutes =
                String(now.getMinutes()).padStart(2, "0");

            const seconds =
                String(now.getSeconds()).padStart(2, "0");

            const month =
                now.getMonth() + 1;

            const date =
                now.getDate();


            document.getElementById("watch-hour").textContent =
                hours;

            document.getElementById("watch-minute").textContent =
                minutes;

            document.getElementById("watch-second").textContent =
                seconds;

            document.getElementById("watch-day").textContent =
                days[now.getDay()];

            document.getElementById("watch-date").textContent =
                month + "-" + date;
        }


        updateWatch();

        setInterval(updateWatch, 1000);

    </script>

</body>
</html>

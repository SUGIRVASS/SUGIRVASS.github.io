<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sugirvas Senthilkumar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #00ff00;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Courier New", Courier, monospace;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h2 {
            margin-top: 14px;
            margin-bottom: 28px;

            font-size: 20px;
            font-weight: normal;
            letter-spacing: 6px;
        }

        .contact {
            margin: 10px 0;
            font-size: 16px;
        }

        .contact a {
            color: #00ff00;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* =========================
           DIGITAL CLOCK
        ========================= */

        .clock-box {
            position: fixed;
            top: 24px;
            right: 24px;

            background: #050505;
            border: 1px solid #00ff00;
            border-radius: 10px;

            padding: 14px 16px;
            min-width: 260px;

            color: #00ff00;
            text-align: center;

            box-shadow:
                0 0 10px rgba(0, 255, 0, 0.15),
                0 0 20px rgba(0, 255, 0, 0.05);

            z-index: 1000;

            /* DO NOT ALLOW CLOCK TEXT TO BE SELECTED */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;

            /* prevents long-press text menu on mobile */
            -webkit-touch-callout: none;

            /* always show normal arrow cursor */
            cursor: default;
        }

        .clock-box * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -webkit-touch-callout: none;

            cursor: default;
        }

        .clock-time {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .clock-seconds {
            font-size: 20px;
        }

        .clock-ampm {
            font-size: 16px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .clock-date {
            font-size: 14px;
            letter-spacing: 1px;
            color: #7dff7d;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            h1 {
                font-size: 32px;
                letter-spacing: 2px;
            }

            h2 {
                font-size: 16px;
                letter-spacing: 4px;
            }

            .contact {
                font-size: 14px;
            }

            .clock-box {
                top: 12px;
                right: 12px;

                min-width: 210px;
                padding: 10px 12px;
            }

            .clock-time {
                font-size: 24px;
            }

            .clock-seconds {
                font-size: 16px;
            }

            .clock-ampm {
                font-size: 13px;
            }

            .clock-date {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- DIGITAL CLOCK -->

    <div class="clock-box">

        <div class="clock-time">

            <span id="clock-hour-minute">
                12:00
            </span>

            :<span
                id="clock-seconds"
                class="clock-seconds">
                00
            </span>

            <span
                id="clock-ampm"
                class="clock-ampm">
                AM
            </span>

        </div>

        <div
            id="clock-date"
            class="clock-date">
            MON • 17/09/2026
        </div>

    </div>


    <!-- MAIN WEBSITE -->

    <main class="container">

        <h1>
            SUGIRVAS SENTHILKUMAR
        </h1>

        <h2>
            CYBERSECURITY
        </h2>

        <p class="contact">

            EMAIL:

            <a href="mailto:sugirvas01@gmail.com">
                sugirvas01@gmail.com
            </a>

        </p>

        <p class="contact">
            PHONE: +91 XXXXXXXXXX
        </p>

    </main>


    <!-- CLOCK SCRIPT -->

    <script>

        function updateClock() {

            const now = new Date();

            const days = [
                "SUN",
                "MON",
                "TUE",
                "WED",
                "THU",
                "FRI",
                "SAT"
            ];


            let hours = now.getHours();

            const minutes =
                String(now.getMinutes()).padStart(2, "0");

            const seconds =
                String(now.getSeconds()).padStart(2, "0");


            const ampm =
                hours >= 12 ? "PM" : "AM";


            hours = hours % 12;

            hours =
                hours ? hours : 12;


            const hourString =
                String(hours).padStart(2, "0");


            const day =
                days[now.getDay()];


            const date =
                String(now.getDate()).padStart(2, "0");


            const month =
                String(now.getMonth() + 1).padStart(2, "0");


            const year =
                now.getFullYear();


            document
                .getElementById("clock-hour-minute")
                .textContent =
                `${hourString}:${minutes}`;


            document
                .getElementById("clock-seconds")
                .textContent =
                seconds;


            document
                .getElementById("clock-ampm")
                .textContent =
                ampm;


            document
                .getElementById("clock-date")
                .textContent =
                `${day} • ${date}/${month}/${year}`;
        }


        updateClock();

        setInterval(updateClock, 1000);

    </script>

</body>
</html>
